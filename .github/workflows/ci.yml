name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

  # Linux targets build with cross (Docker), macOS targets natively on the runner.
  build:
    name: Build (${{ matrix.target }})
    needs: check
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-apple-darwin, os: macos-latest }
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-latest, cross: true, packages: true }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-latest, cross: true, packages: true }
          - { target: armv7-unknown-linux-gnueabihf, os: ubuntu-latest, cross: true }
          - { target: i686-unknown-linux-gnu, os: ubuntu-latest, cross: true }
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest, cross: true }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-latest, cross: true }
          - { target: armv7-unknown-linux-musleabihf, os: ubuntu-latest, cross: true }
          - { target: i686-unknown-linux-musl, os: ubuntu-latest, cross: true }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: taiki-e/install-action@v2
        if: ${{ matrix.cross }}
        with:
          tool: cross
      - run: ${{ matrix.cross && 'cross' || 'cargo' }} build --release --locked --target ${{ matrix.target }}
      - name: Package
        run: tar -C target/${{ matrix.target }}/release -czf papermend-${{ matrix.target }}.tar.gz papermend
      # Debian and RPM packages for the two mainstream Linux architectures, from the same binary.
      - name: Package deb and rpm
        if: ${{ matrix.packages }}
        run: |
          cargo install cargo-deb cargo-generate-rpm
          cargo deb --no-build --no-strip --target ${{ matrix.target }} -o .
          cargo generate-rpm --target ${{ matrix.target }} -o .
      - uses: actions/upload-artifact@v4
        with:
          name: papermend-${{ matrix.target }}
          path: |
            papermend-*.tar.gz
            *.deb
            *.rpm

  release:
    name: Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - run: shasum -a 256 papermend*.tar.gz papermend*.deb papermend*.rpm > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            papermend*.tar.gz
            papermend*.deb
            papermend*.rpm
            SHA256SUMS

  # Opens a version-bump PR on the tap with the official `brew bump-formula-pr`; the tap's own
  # workflows (from `brew tap-new`) then build and publish bottles when the PR is merged.
  # Needs the TAP_TOKEN secret: a classic PAT with repo scope on lancylot2004/homebrew-tap.
  homebrew:
    name: Homebrew
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest
    env:
      HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.TAP_TOKEN }}
    steps:
      - name: Bump formula
        run: |
          URL="https://github.com/lancylot2004/papermend/archive/refs/tags/${GITHUB_REF_NAME}.tar.gz"
          SHA=$(curl -fsSL "$URL" | shasum -a 256 | cut -d' ' -f1)
          brew tap lancylot2004/tap
          brew bump-formula-pr lancylot2004/tap/papermend \
            --url "$URL" --sha256 "$SHA" \
            --message "Automated bump from the papermend release workflow." \
            --no-browse --no-fork
