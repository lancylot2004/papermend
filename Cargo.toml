[package]
name = "papermend"
version = "0.1.0"
authors = ["Lancelot Liu <me@lancy.dev>"]
edition = "2024"
description = "Minimal, CLI-only PaperCut Print Deploy client for macOS and Linux. Nothing runs in the background."
readme = "README.md"
license = "MIT"
keywords = ["papercut", "printing", "cups"]
categories = ["command-line-utilities"]
repository = "https://github.com/lancylot2004/papermend"

# cargo-binstall: where the CI release job puts the prebuilt binaries, and how they unpack.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }.tar.gz"
pkg-fmt = "tgz"
bin-dir = "{ bin }{ binary-ext }"

# cargo-generate-rpm: what goes into the .rpm. With --target, `target/release` is rewritten to
# the target's own release directory. cargo-deb needs no configuration.
[package.metadata.generate-rpm]
assets = [{ source = "target/release/papermend", dest = "/usr/bin/papermend", mode = "755" }]

[dependencies]
# CLI: Derivation-based CLI generator.
clap = { version = "4.6.7", features = ["derive", "env"] }

# CLI: Coloured output that respects NO_COLOR and non-terminals. Already pulled in by clap.
anstream = "1.0.0"

# Async: Runtime for HTTP and subprocesses.
tokio = { version = "1.54.1", features = ["macros", "rt", "process"] }

# HTTP: Async client. Default TLS is rustls with the platform verifier, so the OS trust store
#       (including MDM-installed CAs) is honoured.
reqwest = { version = "0.13.5", default-features = false, features = [
    "json",
    "charset",
    "http2",
    "system-proxy",
    "rustls-no-provider",
] }

# HTTP: TLS with the ring provider: unlike the default aws-lc-rs, it cross-compiles with a plain
# C compiler, which keeps every release target buildable with cross.
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }

# Serialisation: Print Deploy wire format.
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

# Utility: URL building and parsing.
url = "2.5.8"

# Utility: Local interface addresses, which the server uses to pick queues.
if-addrs = "0.15.0"

# Utility: Hidden password prompt.
rpassword = "7.5.4"

# Language: Helpers for customising derives.
derive_more = { version = "2.1.1", features = ["display", "from", "error"] }

[dev-dependencies]
# Testing: Parametrised tests.
rstest = "0.28.0"

[[bin]]
name = "papermend"
path = "src/main.rs"
